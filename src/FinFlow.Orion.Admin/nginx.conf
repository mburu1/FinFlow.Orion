server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly is a client-routed SPA — any path that isn't a real
    # static file falls back to index.html so client-side routing can handle it.
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~* \.(?:dll|wasm|blat|dat|pdb)$ {
        add_header Cache-Control "no-cache";
    }
}
