name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # ubuntu-latest ships Docker pre-installed and supports Linux containers,
    # which the Testcontainers-based integration test projects need to spin up
    # their own SQL Server/MongoDB instances. windows-latest does not reliably
    # support Linux containers, so it isn't used here.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore FinFlow.Orion.slnx

      - name: Build
        run: dotnet build FinFlow.Orion.slnx --no-restore -c Release

      - name: Test
        run: dotnet test FinFlow.Orion.slnx --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
